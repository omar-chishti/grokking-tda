# =============================================================================
# grokking-tda  ·  project + environment definition
# -----------------------------------------------------------------------------
# Managed with `uv` (https://docs.astral.sh/uv/).  PEP-621 metadata, so the
# project stays portable even if we ever move off uv.
#
#   Local (laptop, macOS MPS/CPU):   uv sync
#   Cluster (Linux + CUDA):          uv sync            (same lockfile, CUDA wheels)
#   Docker (deterministic build):    uv sync --frozen
#
# PyTorch wheel selection is the only platform-specific bit: on Linux we pull
# the CUDA 12.1 build from the official PyTorch index; on macOS we deliberately
# fall through to PyPI, whose macOS wheel already ships Metal/MPS support.
# =============================================================================

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grokking-tda"
version = "0.1.0"
description = "A research framework for studying grokking through topological data analysis."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [{ name = "Omar Chishti" }]

dependencies = [
  # --- numerics / DL core ----------------------------------------------------
  # PyTorch dropped x86_64 macOS wheels after 2.2.2, so we pin per-platform:
  # the Intel-Mac dev box caps at 2.2.2 (CPU/MPS), the Linux cluster takes a
  # modern CUDA build from the pytorch-cu121 index (see [tool.uv.sources]).
  "torch==2.2.2; sys_platform == 'darwin'",
  "torch>=2.4;  sys_platform != 'darwin'",
  "numpy<2",                 # torch 2.2.x is incompatible with numpy>=2; safe everywhere
  "einops>=0.7",
  # --- configuration / orchestration ----------------------------------------
  "hydra-core>=1.3",         # pulls omegaconf; structured-config composition + multirun
  "hydra-submitit-launcher>=1.2",  # SLURM launcher for sweeps
  # --- analysis --------------------------------------------------------------
  "ripser>=0.6",             # Vietoris-Rips persistent homology (reliable wheels)
  "persim>=0.3",             # persistence-diagram distances / images
  "scipy>=1.11",
  "scikit-learn>=1.3",       # LID estimators, changepoint helpers
  "pandas>=2.0",             # tabular analysis outputs / Fourier tables
  # --- io / ux ---------------------------------------------------------------
  "matplotlib>=3.8",         # vector-first figures
  "fonttools>=4.40",         # derives the small-capitals face used in figure labels
  "tqdm>=4.66",
  "rich>=13.0",              # structured console logging
]

[project.optional-dependencies]
# Heavier / less-portable TDA extras kept optional so the core env always solves.
tda-extra = ["giotto-tda>=0.6"]      # CROCKER, persistence landscapes, cubical
tracking  = ["wandb>=0.16"]          # optional experiment tracking (offline-friendly)

[project.scripts]
gtda-train     = "grokking_tda.cli.train:main"
gtda-analyse   = "grokking_tda.cli.analyse:main"
gtda-plot      = "grokking_tda.cli.plot:main"
gtda-aggregate = "grokking_tda.cli.aggregate:main"
gtda-compare   = "grokking_tda.cli.compare:main"

# --- uv: dev tools + PyTorch index pinning -----------------------------------
[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.8"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu121", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true   # only used when a dependency explicitly points here (Linux torch)

# --- packaging ---------------------------------------------------------------
[tool.hatch.build.targets.wheel]
packages = ["src/grokking_tda"]

# --- tooling -----------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
packages = ["grokking_tda"]
ignore_missing_imports = true   # ripser/persim/giotto ship no stubs
# Off deliberately: this project pins two torch majors (2.2.2 on macOS, >=2.4 on Linux),
# so whether a given `type: ignore` is redundant depends on which stubs mypy happens to
# see. With this on, the same source is clean on one platform and red on the other.
warn_unused_ignores = false

[tool.pytest.ini_options]
markers = ["slow: degree-2 homology on a few hundred points (seconds, not milliseconds)"]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  # torch (Intel OpenMP) and sklearn (LLVM OpenMP) load two runtimes in one process;
  # benign at teardown, and KMP_DUPLICATE_LIB_OK is already set at package import.
  "ignore:(?s).*Found Intel OpenMP.*:RuntimeWarning",
]
