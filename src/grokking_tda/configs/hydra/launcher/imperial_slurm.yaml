# @package hydra.launcher
# SLURM launcher for Hydra multirun sweeps (requires hydra-submitit-launcher).
# Usage:
#   gtda-train -m +experiment=tf_mod97_grok seed=0,1,2,3,4 \
#       hydra/launcher=imperial_slurm
# Set partition/account to your own scheduler's before use; the values below are a
# working shape, not a live configuration. The DoC workstation pool this project
# actually ran on is driven by scripts/remote/ instead (docs/CLUSTER.md).
_target_: hydra_plugins.hydra_submitit_launcher.submitit_launcher.SlurmLauncher
submitit_folder: ${output_root}/_submitit/${now:%Y%m%d_%H%M%S}
timeout_min: 240
cpus_per_task: 8
gpus_per_node: 1
tasks_per_node: 1
mem_gb: 32
nodes: 1
name: grokking-tda
partition: null # e.g. "gpus" — set to the real partition
array_parallelism: 16 # max concurrent array jobs
additional_parameters: {}
setup: [] # shell lines to run before the job, e.g. module loads
