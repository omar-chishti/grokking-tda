name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check src tests analysis sidequest scripts
      - run: uv run mypy
      - name: pytest
        # ripser/scikit-learn and torch each load their own OpenMP runtime; without
        # this the analysis tests can deadlock on a shared runner.
        env:
          OMP_NUM_THREADS: 1
          KMP_DUPLICATE_LIB_OK: TRUE
        run: uv run pytest
