# Managed with uv; one lockfile serves the laptop, the cluster and the container.
# The torch wheel is the only platform-specific choice, and it is forced: see below.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grokking-tda"
version = "0.1.0"
description = "A research framework for studying grokking through topological data analysis."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [{ name = "Omar Chishti" }]

dependencies = [
  # torch dropped x86_64 macOS wheels after 2.2.2, so the pin is per-platform: the
  # Intel Mac caps there, the Linux cluster takes CUDA from the index below.
  "torch==2.2.2; sys_platform == 'darwin'",
  "torch>=2.4;  sys_platform != 'darwin'",
  "numpy<2",                 # torch 2.2.x is incompatible with numpy>=2
  "einops>=0.7",
  "hydra-core>=1.3",         # pulls omegaconf; structured-config composition and multirun
  "hydra-submitit-launcher>=1.2",
  "ripser>=0.6",             # Vietoris-Rips persistent homology
  "persim>=0.3",             # persistence-diagram distances
  "scipy>=1.11",
  "scikit-learn>=1.3",
  "pandas>=2.0",
  "matplotlib>=3.8",
  "fonttools>=4.40",         # derives the small-capitals face the figure labels use
  "tqdm>=4.66",
  "rich>=13.0",
]

[project.optional-dependencies]
# Kept out of the core so the environment always solves without them.
tda-extra = ["giotto-tda>=0.6"]      # CROCKER, persistence landscapes, cubical
tracking  = ["wandb>=0.16"]

[project.scripts]
gtda-train     = "grokking_tda.cli.train:main"
gtda-analyse   = "grokking_tda.cli.analyse:main"
gtda-plot      = "grokking_tda.cli.plot:main"
gtda-aggregate = "grokking_tda.cli.aggregate:main"
gtda-compare   = "grokking_tda.cli.compare:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.8"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu121", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true   # used only where a dependency points here, which is the Linux torch pin

[tool.hatch.build.targets.wheel]
packages = ["src/grokking_tda"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
packages = ["grokking_tda"]
ignore_missing_imports = true   # ripser/persim/giotto ship no stubs
# Off deliberately: this project pins two torch majors (2.2.2 on macOS, >=2.4 on Linux),
# so whether a given `type: ignore` is redundant depends on which stubs mypy happens to
# see. With this on, the same source is clean on one platform and red on the other.
warn_unused_ignores = false

[tool.pytest.ini_options]
markers = ["slow: degree-2 homology on a few hundred points (seconds, not milliseconds)"]
testpaths = ["tests"]
addopts = "-q"
# The reduction layer is run from the repository root and is not installed, so the tests
# that cover it need the root on the path however pytest was invoked.
pythonpath = ["."]
filterwarnings = [
  # torch (Intel OpenMP) and sklearn (LLVM OpenMP) load two runtimes in one process;
  # benign at teardown, and KMP_DUPLICATE_LIB_OK is already set at package import.
  "ignore:(?s).*Found Intel OpenMP.*:RuntimeWarning",
]
